name: mca_app
description: "AI-Powered Smart Food Rescue & Distribution System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1
  
  # Real-time
  socket_io_client: ^3.0.2

  # Network & API
  dio: ^5.7.0
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  logger: ^2.5.0
  permission_handler: ^11.3.1
  
  # Images & Files
  image_picker: ^1.1.2
  cloudinary_public: ^0.23.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  pdf: ^3.10.10
  printing: ^5.13.0

  # Location & Maps
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # UI & Animation
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  flutter_svg: ^2.0.10+1
  signature: ^6.3.0
  syncfusion_flutter_charts: ^34.1.32
  flutter_animate: ^4.5.2
  path_provider: ^2.1.6
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
